---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: drawio
spec:
  extends: mac-software
  source:
    resolver: github
    repository: jgraph/drawio-desktop
    asset: draw.io-arm64-*.dmg
  application:
    bundle_id: com.jgraph.drawio.desktop
  signatures:
    - signer: apple:developer-id:UZEUFB4N53 # DRAW.IO LTD
  icon: drawio
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: draw.io is a diagramming application for flowcharts, process diagrams,
          organisation charts, UML, entity relationship and network diagrams.
        developer: draw.io
        name: draw.io
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
