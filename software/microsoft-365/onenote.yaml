# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-onenote
spec:
  application:
    bundle_id: com.microsoft.onenote.mac
    installed_path: /Applications/Microsoft OneNote.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft AutoUpdate
          - Microsoft Error Reporting
          - Microsoft OneNote
        category: Productivity
        description: Capture, organize, and share your notes, ideas, and to-do lists, making
          information retrieval a breeze.
        developer: Microsoft
        name: Microsoft OneNote
        unattended_install: true
        uninstallable: false
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
  extends: mac-software
  icon: microsoft-onenote
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  source:
    resolver: microsoft
    product: onenote
