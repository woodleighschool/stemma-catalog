# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-excel
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: excel
  application:
    bundle_id: com.microsoft.Excel
    installed_path: /Applications/Microsoft Excel.app
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  icon: microsoft-excel
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft AutoUpdate
          - Microsoft Error Reporting
          - Microsoft Excel
        category: Productivity
        description: Harness the power of advanced spreadsheets to analyze data, visualize trends,
          and streamline complex calculations.
        developer: Microsoft
        name: Microsoft Excel
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
