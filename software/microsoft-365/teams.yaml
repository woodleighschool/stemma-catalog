# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-teams
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: teams
  application:
    bundle_id: com.microsoft.teams2
    installed_path: /Applications/Microsoft Teams.app
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  icon: microsoft-teams
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft Teams
          - Microsoft Teams (work or school)
        category: Productivity
        description: Microsoft Teams is your modern solution for seamless collaboration and
          communication in the digital workplace. This platform brings together chat, video
          meetings, file collaboration, and integrated app functionalities in one place.
        developer: Microsoft
        name: Microsoft Teams
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
