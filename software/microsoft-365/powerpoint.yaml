# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-powerpoint
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: powerpoint
  application:
    bundle_id: com.microsoft.Powerpoint
    installed_path: /Applications/Microsoft PowerPoint.app
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  icon: microsoft-powerpoint
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft AutoUpdate
          - Microsoft Error Reporting
          - Microsoft PowerPoint
        category: Productivity
        description: Design impactful presentations with stunning visuals and engaging content to
          captivate your audience.
        developer: Microsoft
        name: Microsoft PowerPoint
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
