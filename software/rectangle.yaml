# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: rectangle
spec:
  extends: mac-software
  source:
    resolver: github
    repository: rxhanson/Rectangle
    asset: Rectangle.pkg
  application:
    bundle_id: com.knollsoft.Rectangle
  signature:
    signer: apple:developer-id:XSYZ3E4B7D # Ryan Hanson
  destinations:
    woodstar:
      pkginfo:
        category: Utilities
        description: Rectangle is a free and open-source window management app for macOS.
          Move and resize windows using keyboard shortcuts or by dragging them to
          the edges and corners of the screen.
        developer: Ryan Hanson
        name: Rectangle
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - optional_installs
              - managed_updates
        exclude: []
