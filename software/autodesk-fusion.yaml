# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: autodesk-fusion
spec:
  extends: mac-software
  source:
    url: https://dl.appstreaming.autodesk.com/production/installers/Autodesk%20Fusion%20Admin%20Install.pkg
  application:
    bundle_id: com.autodesk.edu.fusion360
    installed_path: /Applications/Autodesk Fusion.app
  signature:
    signer: apple:developer-id:XXKJ396S2Y # Autodesk
  icon: autodesk-fusion
  destinations:
    woodstar:
      pkginfo:
        category: STEAM
        description: Fusion is software for 3D CAD, modelling, manufacturing, industrial design,
          electronics & mechanical engineering.
        developer: Autodesk Inc.
        name: Autodesk Fusion
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
