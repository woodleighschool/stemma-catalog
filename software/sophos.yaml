---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: sophos
suspend: true
spec:
  inputs:
    vendor:
      url: "{{ env.SOPHOS_DOWNLOAD_URL }}"
      filename: SophosInstall.zip
  signatures:
    - input: vendor
      signer: apple:developer-id:2H5GFH3774 # Sophos
  scripts:
    postinstall: |-
      #!/bin/zsh --no-rcs

      setopt errexit

      directory="${0:A:h}/installer"
      installer="$directory/Sophos Installer.app/Contents/MacOS/Sophos Installer"
      helper="$directory/Sophos Installer.app/Contents/MacOS/tools/com.sophos.bootstrap.helper"

      /bin/chmod a+x "$installer" "$helper"
      cd "$directory"
      "$installer" --quiet
    installer:
      $input: vendor
      path: .
  package:
    identifier: com.github.woodleighschool.pkg.Sophos
    version: "{{ inputs.vendor.facts['Sophos Installer.app'].app.version }}-2"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: sophos
suspend: true
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: sophos
  minimum_os: "13.5"
  icon: sophos
  destinations:
    woodstar:
      pkginfo:
        category: Security
        description: By combining cutting-edge technologies, such as deep learning and endpoint
          detection and response, Intercept X delivers unmatched protection against unknown malware,
          exploits, and ransomware.
        developer: Sophos
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          service="/Library/Sophos Anti-Virus/SophosServiceManager.app/Contents/MacOS/SophosServiceManager"
          [[ -f $service ]] && /usr/bin/pgrep -qf "$service" && exit 1
          exit 0
        name: Sophos
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude:
          - label_name: Defender Test
