---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: chatgpt
suspend: true
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: chatgpt
  application:
    bundle_id: com.openai.codex
  signatures:
    - signer: apple:developer-id:2DC432GLL2 # OpenAI OpCo, LLC
  icon: chatgpt
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: ChatGPT is OpenAI's AI assistant for writing, learning, brainstorming and
          coding.
        developer: OpenAI
        name: ChatGPT
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - managed_updates
        exclude: []
