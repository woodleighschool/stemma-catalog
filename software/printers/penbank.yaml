# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: penbank-campus-printers
spec:
  destinations:
    woodstar:
      pkginfo:
        blocking_applications: []
        category: Printers
        description: Adds the Penbank Campus print queue.
        developer: Woodleigh School
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          queue_name="penbank_campus"

          /usr/bin/lpstat -p "${queue_name}" >/dev/null 2>&1 && exit 1

          exit 0
        installer_type: nopkg
        minimum_os_version: "11.0"
        name: Penbank Campus Printers
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          set -euo pipefail

          queue_name="penbank_campus"
          display_name="Penbank Campus"
          location="Penbank Campus"
          printserver_host="pc-printserver.woodleighschool.net"
          printserver_queue="PCPQ"
          printer_uri="lpd://${printserver_host}/${printserver_queue}"
          ppd="/Library/Printers/PPDs/Contents/Resources/EPSON AM-C6000 Series.gz"

          /usr/sbin/lpadmin \
              -p "${queue_name}" \
              -E \
              -v "${printer_uri}" \
              -P "${ppd}" \
              -D "${display_name}" \
              -L "${location}" \
              -o printer-is-shared=false \
              -o EPIJ_Bidi_Com=0 \
              -o EPIJ_FUnt=2 \
              -o EPIJ_Fnsr=4 \
              -o EPIJ_OptFUnit=2 \
              -o EPIJ_PUnt=2
        requires:
          - EPSON Drivers
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: uninstall_script
        uninstall_script: |-
          #!/bin/zsh --no-rcs

          queue_name="penbank_campus"

          if /usr/bin/lpstat -p "${queue_name}" >/dev/null 2>&1; then
              /usr/sbin/lpadmin -x "${queue_name}"
          fi
        uninstallable: true
        version: "1.2"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: Penbank Campus
          - actions:
              - optional_installs
            label_name: All Hosts
  extends: mac-software
  icon: printers
