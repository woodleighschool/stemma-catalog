# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: minimbah-campus-printers
spec:
  destinations:
    woodstar:
      pkginfo:
        blocking_applications: []
        category: Printers
        description: Adds the Minimbah Campus print queue.
        developer: Woodleigh School
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          queue_name="minimbah_campus"

          /usr/bin/lpstat -p "${queue_name}" >/dev/null 2>&1 && exit 1

          exit 0
        installer_type: nopkg
        minimum_os_version: "11.0"
        name: Minimbah Campus Printers
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          set -euo pipefail

          queue_name="minimbah_campus"
          display_name="Minimbah Campus"
          location="Minimbah Campus"
          printserver_host="mc-printserver.woodleighschool.net"
          printserver_queue="MCPQ"
          printer_uri="lpd://${printserver_host}/${printserver_queue}"
          ppd="/Library/Printers/PPDs/Contents/Resources/EPSON AM-C6000 Series.gz"

          /usr/sbin/lpadmin \
              -p "${queue_name}" \
              -E \
              -v "${printer_uri}" \
              -P "${ppd}" \
              -D "${display_name}" \
              -L "${location}" \
              -o printer-is-shared=false \
              -o EPIJ_Bidi_Com=0 \
              -o EPIJ_FUnt=2 \
              -o EPIJ_Fnsr=4 \
              -o EPIJ_OptFUnit=2 \
              -o EPIJ_PUnt=2
        requires:
          - EPSON Drivers
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: uninstall_script
        uninstall_script: |-
          #!/bin/zsh --no-rcs

          queue_name="minimbah_campus"

          if /usr/bin/lpstat -p "${queue_name}" >/dev/null 2>&1; then
              /usr/sbin/lpadmin -x "${queue_name}"
          fi
        uninstallable: true
        version: "1.2"
  extends: mac-software
  icon: printers
