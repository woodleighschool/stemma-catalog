# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: dante-controller
spec:
  extends: mac-software
  source:
    resolver: audinate
    product: dante-controller
  signature:
    signer: apple:developer-id:P4WCR6Y822 # Audinate Pty Ltd
  package_path: DanteController.pkg
  application:
    path: DanteController.pkg/Payload/Dante Controller.app
    installed_path: /Applications/Dante Controller.app
  destinations:
    woodstar:
      pkginfo:
        category: Utilities
        description: Configures Dante audio routing and monitors device status, network
          latency and clock stability.
        developer: Audinate
        name: Dante Controller
        unattended_install: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
