# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: audacity-3
suspend: true
spec:
  extends: mac-software
  source:
    resolver: github
    repository: audacity/audacity
    release: Audacity-3.*
    asset: audacity-macOS-*-arm64.dmg
  signatures:
    - subject:
        path: Audacity.app
      signer: apple:developer-id:6EPAF2X3PR # MuseScore
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: Audacity is the world's most popular free software for recording and editing
          audio. So if you're producing music, a podcast, or just playing around with audio,
          Audacity is for you.
        developer: Audacity
        name: Audacity 3
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
