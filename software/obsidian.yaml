---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: obsidian
spec:
  extends: mac-software
  source:
    resolver: github
    repository: obsidianmd/obsidian-releases
    asset: Obsidian-*.dmg
  application:
    bundle_id: md.obsidian
  signatures:
    - signer: apple:developer-id:6JSW4SJWN9 # Dynalist Inc.
  icon: obsidian
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Obsidian is the private and flexible writing app that adapts to the way you
          think.
        developer: Obsidian
        name: Obsidian
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
