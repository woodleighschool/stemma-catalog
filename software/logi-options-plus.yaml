---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: logi-options-plus
spec:
  inputs:
    vendor:
      url: https://download01.logi.com/web/ftp/pub/techsupport/optionsplus/logioptionsplus_installer_offline.zip
  signatures:
    - input: vendor
      signer: apple:developer-id:QED4VVPZWA
  scripts:
    postinstall: |-
      #!/bin/zsh --no-rcs

      exec "${0:A:h}/installer/logioptionsplus_installer_offline.app/Contents/MacOS/logioptionsplus_installer" --quiet
    installer:
      $input: vendor
      path: .
  package:
    identifier: com.github.woodleighschool.pkg.LogiOptionsPlus
    version: "{{ inputs.vendor.facts['logioptionsplus_installer_offline.app'].app.build }}"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: logi-options-plus
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: logi-options-plus
  minimum_os: "14.0"
  icon: logi-options-plus
  subjects:
    wrapper:
      kind: package
  destinations:
    woodstar:
      pkginfo:
        category: Utilities
        description: Customise Logitech mice, keyboards and other devices, including buttons,
          gestures, scrolling and device settings.
        developer: Logitech
        installs:
          - path: /Applications/logioptionsplus.app
            type: application
            CFBundleIdentifier: com.logi.optionsplus
            CFBundleShortVersionString: "{{ facts.wrapper.package.version }}"
        name: Logi Options+
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
