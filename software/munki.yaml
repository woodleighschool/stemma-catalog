---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: munki
spec:
  source:
    resolver: github
    repository: munki/munki
    asset: munkitools-*.pkg
  application:
    bundle_id: com.googlecode.munki.ManagedSoftwareCenter
    installed_path: "/Applications/Managed Software Center.app"
  signatures:
    - signer: apple:developer-id:T4SK8ZXCXG # Mac Admins Open Source
  minimum_os: "11.0"
  icon: munki
  destinations:
    jamf:
      policies:
        - name: ALL - Install Munki - ALL
          enabled: true
          triggers: [checkin]
          frequency: once_per_computer
          retries: 3
          event: ""
          update_inventory: false
          self_service: false
          scope:
            all_computers: true
    intune:
      display_name: Munki
      description: Munki is a set of tools that, used together with a webserver-based repository of
        packages and package metadata, can be used by macOS administrators to manage software
        installs (and in many cases removals) on macOS client machines.
      publisher: &publisher Mac Admins Open Source
      developer: *publisher
      information_url: https://www.munki.org/munki/
      categories:
        - Computer Management
      ignore_version_detection: false
      assignments:
        - intent: required
          all_devices: true
        - intent: required
          exclude_group: d66e93af-3c1b-4c40-b235-b2f56374c7e8 # Intune - Dedicated Macs
