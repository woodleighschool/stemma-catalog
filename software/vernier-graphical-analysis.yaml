# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: vernier-graphical-analysis
spec:
  extends: mac-software
  source:
    url: https://software-releases.graphicalanalysis.com/ga/mac/release/latest/Vernier-Graphical-Analysis.dmg
  application:
    path: Vernier Graphical Analysis.app
    bundle_id: Vernier.GraphicalAnalysis
    installed_path: /Applications/Vernier Graphical Analysis.app
  signature:
    signer: apple:developer-id:75WN2B2WR8 # Vernier Software & Technology
  icon: vernier-graphical-analysis
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Vernier Graphical Analysis pairs with sensors to let students collect,
          visualise, and analyse lab data directly on their Mac.
        developer: Vernier
        name: Vernier Graphical Analysis
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
