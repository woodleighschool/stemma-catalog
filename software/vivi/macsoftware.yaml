# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: vivi
spec:
  application:
    installed_path: /Applications/Vivi.app
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Vivi is the only scalable, easy-to-use wireless screensharing and student
          engagement platform engineered for, and by, the education sector. Any device, any number
          of users or classrooms, any media type, any learning type, any display.
        developer: Vivi
        name: Vivi
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
  extends: mac-software
  source:
    filename: Vivi.pkg
    url: https://api.vivi.io/mac
  verification:
    integrity: true
    signature: true
    subject: source
