---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: activinspire-installer
spec:
  source:
    url: https://inspire.activsoftware.co.uk/activinspire/ActivInspire_en_GB_mac.dmg
  package_path: ActivInspire*.pkg
  application:
    path: InspireInstaller.pkg/Payload/Applications/Promethean/Activsoftware Inspire/Inspire.app
  signatures:
    - signer: apple:developer-id:PQ96WVYU2E # Promethean
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: activinspire
spec:
  inputs:
    installer:
      resource:
        kind: MacSoftware
        name: activinspire-installer
  signatures:
    - input: installer
      signer: apple:developer-id:PQ96WVYU2E # Promethean
  scripts:
    postinstall: |-
      #!/bin/zsh --no-rcs

      # The installer's own check accepts only an Intel processor, which it sees under Rosetta.
      exec /usr/bin/arch -x86_64 /usr/sbin/installer -pkg "${0:A:h}/installer.pkg" -target /
    installer.pkg:
      $input: installer
  package:
    identifier: com.github.woodleighschool.pkg.ActivInspire
    version: "{{ inputs.installer.version }}"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: activinspire
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: activinspire
  icon: activinspire
  subjects:
    wrapper:
      kind: package
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: ActivInspire lesson delivery software is a free teaching software tool for
          classroom interactive touchboards, displays, and whiteboards.
        developer: Promethean
        installs:
          - path: /Applications/Promethean/Activsoftware Inspire/Inspire.app
            type: application
            CFBundleIdentifier: com.prometheanworld.ActivSoftware.ActivInspire.1
            CFBundleShortVersionString: "{{ facts.wrapper.package.version }}"
        name: ActivInspire
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          setopt errexit

          directory=/Users/Shared/Promethean/ActivInspire
          /bin/mkdir -p "$directory"

          /bin/cat > "$directory/.inspire_license.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <License>
            <username>Woodleigh</username>
            <organization>Woodleigh</organization>
            <serial>{{ env.ACTIVINSPIRE_SERIAL }}</serial>
          </License>
          EOF

          /usr/sbin/chown root:wheel "$directory/.inspire_license.xml"
          /bin/chmod 0644 "$directory/.inspire_license.xml"
        postuninstall_script: |-
          #!/bin/zsh --no-rcs

          /bin/rm -rf /Users/Shared/Promethean
        # The receipts of the installer the package runs.
        receipts:
          - packageid: com.promethean.pkg.ActivsoftwareInspire
          - packageid: com.promethean.ActivsoftwareInspireHelpGBR
          - packageid: com.promethean.ActivsoftwareInspireResourcesGBR
        requires:
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - optional_installs
              - managed_updates
          - label_name: CRT/Spare Shared MacBooks
            actions:
              - optional_installs
              - managed_updates
        exclude: []
