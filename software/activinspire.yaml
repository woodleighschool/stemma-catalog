# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: activinspire
spec:
  extends: mac-software
  source:
    url: https://www.activsoftware.co.uk/update/Inspire/updatemac.txt
    match: 'https?://www\.activsoftware\.co\.uk/update/Inspire/update/mac/ActivInspire_Application_v[0-9.]+_MAC\.dmg'
  signature:
    signer: apple:developer-id:PQ96WVYU2E # Promethean
  package_path: ActivInspire_Application_*_MAC.pkg
  application:
    path: InspireInstaller.pkg/Payload/Applications/Promethean/Activsoftware Inspire/Inspire.app
    installed_path: /Applications/Promethean/Activsoftware Inspire/Inspire.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Inspire
        category: Education
        description: Lesson delivery software for classroom interactive displays and
          whiteboards.
        developer: Promethean
        name: ActivInspire
        postinstall_script: |-
          #!/bin/sh
          set -eu
          directory="/Users/Shared/Promethean/ActivInspire"
          /bin/mkdir -p "$directory"
          /usr/bin/printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<License>' \
            '  <username>Woodleigh</username>' \
            '  <organization>Woodleigh</organization>' \
            '  <serial>{{ env.ACTIVINSPIRE_SERIAL }}</serial>' \
            '</License>' > "$directory/.inspire_license.xml"
        postuninstall_script: |-
          #!/bin/sh
          /bin/rm -rf /Users/Shared/Promethean
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Staff
