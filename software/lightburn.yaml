---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: lightburn
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: lightburn
  application:
    bundle_id: com.LightBurnSoftware.LightBurn
  signatures:
    - signer: apple:developer-id:UWZQ3LL82C # LightBurn Software LLC
  icon: lightburn
  destinations:
    woodstar:
      pkginfo:
        category: Graphics & Design
        description: LightBurn is layout, editing, and control software for laser cutters.
        developer: LightBurn Software
        name: LightBurn
        requires:
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
