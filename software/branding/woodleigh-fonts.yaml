---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: woodleigh-fonts
suspend: true
spec:
  inputs:
    fonts:
      path: Fonts
  payload:
    /Library/Fonts:
      $input: fonts
      mode: "0755"
  package:
    identifier: au.edu.vic.woodleigh.fonts
    version: 1.0.2
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: woodleigh-fonts
suspend: true
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: woodleigh-fonts
  icon: woodleigh-fonts
  destinations:
    woodstar:
      pkginfo:
        category: Graphics & Design
        description: Installs the Woodleigh School font collection.
        developer: Woodleigh
        name: Woodleigh Fonts
        unattended_install: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude: []
