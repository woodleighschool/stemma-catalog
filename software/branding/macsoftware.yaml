# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: branding
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: branding
      output: installer
  icon: branding
  destinations:
    woodstar:
      pkginfo:
        category: Utilities
        description: Applies the Woodleigh wallpaper and initial Dock layout once. The Dock and
          wallpaper remain customisable after setup.
        developer: Woodleigh School
        installs:
          - path: /Library/Desktop Pictures/Woodleigh.jpg
            type: file
        name: Branding
        requires:
          - resource:
              kind: MacSoftware
              name: google-chrome
          - resource:
              kind: MacSoftware
              name: microsoft-365-business-pro-suite
        unattended_install: true
        uninstallable: false
        version: "1.1"
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude: []
