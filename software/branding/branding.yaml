---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: branding
spec:
  inputs:
    scripts:
      path: Scripts
    wallpaper:
      url: https://r2-d2.woodleigh.vic.edu.au/Woodleigh.jpg
  payload:
    /Library/Desktop Pictures/Woodleigh.jpg:
      $input: wallpaper
      mode: "0644"
  scripts:
    preinstall:
      $input: scripts
      path: preinstall
    postinstall:
      $input: scripts
      path: postinstall
  package:
    identifier: au.edu.vic.woodleigh.branding
    version: "1.1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: branding
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: branding
  icon: branding
  destinations:
    woodstar:
      pkginfo:
        category: System
        description: Applies the Woodleigh wallpaper and initial Dock layout once. The Dock and
          wallpaper remain customisable after setup.
        developer: Woodleigh School
        installs:
          - path: /Library/Desktop Pictures/Woodleigh.jpg
            type: file
        name: Branding
        requires:
          - resource:
              kind: MacSoftware
              name: google-chrome
          - resource:
              kind: MacSoftware
              name: microsoft-365-business-pro-suite
        unattended_install: true
        uninstallable: false
        version: "1.1"
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude: []
