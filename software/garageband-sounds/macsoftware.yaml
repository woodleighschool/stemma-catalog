---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: garageband-all-sounds
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: garageband-all-sounds
      output: installer
  minimum_os: "14.0"
  icon: garageband-sounds
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - GarageBand
        category: Media
        description: The complete collection of sounds and instruments for GarageBand.
        developer: Apple
        installcheck_script: |-
          #!/bin/zsh --no-rcs
          setopt pipefail

          manifests=(/Applications/GarageBand.app/Contents/Resources/garageband<->.plist(Nn))
          saved="/Library/Application Support/Woodleigh/GarageBandAllSounds/${manifests[-1]:t}"
          receipts=($(/usr/sbin/pkgutil --pkgs))

          installed() { (( $receipts[(Ie)$1] )) }
          any_exist() { local file; for file; do [[ -e $file ]] && return 0; done; return 1 }

          [[ -f $saved ]] || exit 0
          packages=$(
              { /usr/bin/plutil -extract Packages json -o - "$manifests[-1]" &&
                  /usr/bin/plutil -extract Packages json -o - "$saved" } |
                  /usr/bin/jq -rs '[.[][] | select(.PackageID)] | group_by(.PackageID)[] | last | [.PackageID, .FileCheck] | flatten | @tsv'
          ) || exit 0

          while IFS=$'\t' read -rA package; do
              installed $package[1] && any_exist $package[2,-1] || exit 0
          done <<< $packages
          exit 1
        name: GarageBand All Sounds
        requires:
          - GarageBand
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: uninstall_script
        uninstall_script: |-
          #!/bin/zsh --no-rcs
          setopt errexit pipefail

          state_dir="/Library/Application Support/Woodleigh/GarageBandAllSounds"
          manifests=(
              /Applications/GarageBand.app/Contents/Resources/garageband<->.plist(Nn)
              $state_dir/garageband<->.plist(Nn)
          )
          (( $#manifests )) || exit 1

          optional=($(
              for manifest in $manifests; do
                  /usr/bin/plutil -extract Packages json -o - "$manifest"
              done | /usr/bin/jq -rs '[.[][] | select(.PackageID)] | group_by(.PackageID)[] | last | select(.IsMandatory | not) | .PackageID'
          ))
          receipts=($(/usr/sbin/pkgutil --pkgs))
          installed=(${optional:*receipts})

          if (( $#installed )); then
              /usr/local/munki/removepackages $installed
          fi
          /bin/rm -rf "$state_dir"
        uninstallable: true
        version: 2.0.3.1
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: garageband-essential-sounds
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: garageband-essential-sounds
      output: installer
  minimum_os: "14.0"
  icon: garageband-sounds
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - GarageBand
        category: Media
        description: Essential sounds and instruments for GarageBand.
        developer: Apple
        installcheck_script: |-
          #!/bin/zsh --no-rcs
          setopt pipefail

          manifests=(/Applications/GarageBand.app/Contents/Resources/garageband<->.plist(Nn))
          receipts=($(/usr/sbin/pkgutil --pkgs))

          installed() { (( $receipts[(Ie)$1] )) }
          any_exist() { local file; for file; do [[ -e $file ]] && return 0; done; return 1 }

          packages=$(
              /usr/bin/plutil -extract Packages json -o - "$manifests[-1]" |
                  /usr/bin/jq -r '.[] | select(.IsMandatory and .PackageID) | [.PackageID, .FileCheck] | flatten | @tsv'
          ) || exit 0

          while IFS=$'\t' read -rA package; do
              installed $package[1] && any_exist $package[2,-1] || exit 0
          done <<< $packages
          exit 1
        name: GarageBand Essential Sounds
        requires:
          - GarageBand
        unattended_install: true
        uninstallable: false
        update_for:
          - GarageBand
        version: 2.0.3.2
      targets:
        include: []
        exclude: []
