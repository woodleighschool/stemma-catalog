---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: google-chrome
spec:
  extends: mac-software
  source:
    url: https://dl.google.com/dl/chrome/mac/universal/stable/gcem/GoogleChrome.pkg
  application:
    bundle_id: com.google.Chrome
  signatures:
    - signer: apple:developer-id:EQHXZ8M8AV # Google LLC
  icon: google-chrome
  destinations:
    woodstar:
      pkginfo:
        category: Browsers
        description: Get more done with the new Google Chrome. A more simple, secure, and faster web
          browser than ever, with Google's smarts built-in.
        developer: Google
        name: Google Chrome
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude:
          - label_name: SAC MacBooks
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: WindowsSoftware
metadata:
  name: google-chrome
spec:
  extends: windows-win32
  source:
    resolver: winget
    package: Google.Chrome
    architecture: x64
    scope: machine
    installer_type: wix
  signatures:
    - signer: authenticode:4a6519d3c145fc3838df20b3009980fe59b9bc68ee5871e59aaa0097a523e333 # Google LLC
  icon: google-chrome
  destinations:
    intune:
      display_name: Google Chrome
      description: Get more done with the new Google Chrome. A more simple, secure, and faster web
        browser than ever, with Google's smarts built-in.
      publisher: &publisher Google LLC
      developer: *publisher
      information_url: https://www.google.com/chrome/
      privacy_url: https://policies.google.com/privacy
      categories:
        - Productivity
      detection:
        - type: file
          path: C:\Program Files\Google\Chrome\Application
          name: chrome.exe
          property: version
      assignments:
        - intent: required
          all_devices: true
