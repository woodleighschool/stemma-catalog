---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: windows-app
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: windows-app
  application:
    bundle_id: com.microsoft.rdc.macos
    installed_path: /Applications/Windows App.app
  signatures:
    - signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  icon: windows-app
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Windows App (formerly Microsoft Remote Desktop) is your gateway to Azure
          Virtual Desktop, Windows 365, Microsoft Dev Box, Remote Desktop Services, and remote PCs,
          securely connecting you to Windows devices and apps.
        developer: Microsoft
        name: Windows App
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          user=$(/usr/bin/stat -f %Su /dev/console)
          case $user in
              root | loginwindow | _mbsetupuser | "") exit 0 ;;
          esac

          /bin/launchctl asuser "$(/usr/bin/id -u "$user")" /usr/bin/sudo -H -u "$user" \
              /usr/bin/perl -e 'alarm 15; exec @ARGV' \
              "/Applications/Windows App.app/Contents/MacOS/Windows App" --script \
              bookmark write 7A91ED4C-BEA5-453E-91AC-4F0A7C266390 \
              --hostname rds.woodleigh.vic.edu.au \
              --friendlyname RDS \
              --redirectprinters true \
              --username "$user"
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - optional_installs
              - managed_updates
        exclude: []
