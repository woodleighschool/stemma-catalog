---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: windows-app-rds
spec:
  extends: mac-software
  icon: windows-app-rds
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Adds the Woodleigh Remote Desktop Services connection to Windows App.
        developer: Woodleigh School
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          uuid=7A91ED4C-BEA5-453E-91AC-4F0A7C266390
          user=$(/usr/bin/stat -f %Su /dev/console)

          windows_app() {
              /bin/launchctl asuser "$(/usr/bin/id -u "$user")" /usr/bin/sudo -u "$user" \
                  /usr/bin/perl -e 'alarm 15; exec @ARGV' \
                  "/Applications/Windows App.app/Contents/MacOS/Windows App" --script "$@"
          }

          case $user in
              root | loginwindow | _mbsetupuser | "") exit 1 ;;
          esac
          bookmarks=$(windows_app bookmark list) || exit 1
          [[ $bookmarks == *$uuid* ]] && exit 1
          exit 0
        installer_type: nopkg
        name: Windows App RDS
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          uuid=7A91ED4C-BEA5-453E-91AC-4F0A7C266390
          user=$(/usr/bin/stat -f %Su /dev/console)

          windows_app() {
              /bin/launchctl asuser "$(/usr/bin/id -u "$user")" /usr/bin/sudo -u "$user" \
                  /usr/bin/perl -e 'alarm 15; exec @ARGV' \
                  "/Applications/Windows App.app/Contents/MacOS/Windows App" --script "$@"
          }

          case $user in
              root | loginwindow | _mbsetupuser | "") exit 1 ;;
          esac
          windows_app bookmark write "$uuid" \
              --hostname rds.woodleigh.vic.edu.au \
              --friendlyname RDS \
              --redirectprinters true \
              --username "$user"
        unattended_install: true
        uninstallable: false
        update_for:
          - resource:
              kind: MacSoftware
              name: windows-app
        version: "1.0"
      targets:
        include: []
        exclude: []
