# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: google-chrome
spec:
  application:
    bundle_id: com.google.Chrome
  destinations:
    woodstar:
      pkginfo:
        description: Google Chrome for macOS.
        name: Google Chrome
        uninstall_method: removepackages
        uninstallable: true
  extends: mac-software
  source:
    url: https://dl.google.com/dl/chrome/mac/universal/stable/gcem/GoogleChrome.pkg
  verification:
    integrity: true
    signature: true
    subject: source
