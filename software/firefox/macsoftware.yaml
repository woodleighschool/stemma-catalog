# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: firefox
spec:
  extends: mac-software
  source:
    url: https://download.mozilla.org/?product=firefox-pkg-latest-ssl&os=osx&lang=en-US
  signature:
    signer: apple:developer-id:43AQ936H96 # Mozilla Corporation
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: >-
          Firefox is a free and open-source web browser developed by Mozilla, built to be fast,
          private and secure.
        developer: Mozilla
        name: Firefox
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
