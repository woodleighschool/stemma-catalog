# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: firefox
spec:
  extends: mac-software
  source:
    url: https://download.mozilla.org/?product=firefox-pkg-latest-ssl&os=osx&lang=en-US
  application:
    bundle_id: org.mozilla.firefox
  signature:
    signer: apple:developer-id:43AQ936H96 # Mozilla Corporation
  icon: firefox
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: >-
          Firefox is a free and open source web browser from Mozilla, built to protect your privacy
          while giving you the speed and features you need to get the most out of the web.
        developer: Mozilla
        name: Firefox
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
