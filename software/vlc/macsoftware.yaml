# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: vlc
spec:
  extends: mac-software
  source:
    url: https://www.videolan.org/vlc/download-macosx.html
    match: "//get\\.videolan\\.org/vlc/[0-9.]+/macosx/vlc-[0-9.]+-arm64\\.dmg"
  signature:
    signer: apple:developer-id:75GAHG3SZQ # VideoLAN
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - VLC
        category: Media
        description: VLC is a free and open source cross-platform multimedia player
          and framework that plays most multimedia files, and various streaming protocols.
        developer: VideoLAN
        name: VLC
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  application:
    bundle_id: org.videolan.vlc
