# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: imovie
spec:
  extends: mac-software
  source:
    path: /Applications/iMovie.app
  application:
    installed_path: "/Applications/iMovie.app"
  destinations:
    woodstar:
      pkginfo:
        category: Creativity
        description: iMovie is Apple's video editor for creating and sharing movies.
        developer: Apple
        name: iMovie
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
