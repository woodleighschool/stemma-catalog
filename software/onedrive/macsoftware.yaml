# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: onedrive
spec:
  application:
    bundle_id: com.microsoft.OneDrive
    installed_path: /Applications/OneDrive.app
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Securely store, share, and access your files from anywhere, ensuring your data
          is always within reach.
        developer: Microsoft
        name: OneDrive
        unattended_install: true
        uninstallable: false
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
  extends: mac-software
  icon: onedrive
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  source:
    resolver: microsoft
    product: onedrive
