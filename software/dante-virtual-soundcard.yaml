# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: dante-virtual-soundcard
spec:
  extends: mac-software
  source:
    url: https://software-updates.audinate.com/DanteVirtualSoundcard/appcast/macOS/DanteVirtualSoundcard-macOS.xml
    match: 'https://audinate-software-updates\.sgp1\.cdn\.digitaloceanspaces\.com/DanteVirtualSoundcard/[0-9]+/[0-9.]+/macOS/DVS-[0-9.]+_macos\.dmg'
  package_path: DanteVirtualSoundcard.pkg
  application:
    path: DVS_User_Interface.pkg/Payload/Dante Virtual Soundcard.app
    installed_path: /Applications/Dante Virtual Soundcard.app
  signatures:
    - subject:
        path: .
      signer: apple:developer-id:P4WCR6Y822 # Audinate Pty Ltd
  destinations:
    woodstar:
      pkginfo:
        blocking_applications: []
        category: Media
        description: Dante Virtual Soundcard turns your computer into a Dante-powered workstation,
          seamlessly integrating your PC or Mac with Dante audio devices on your network. Instantly
          connect to record, process and playout using any audio application and any combination of
          Dante-enabled devices.
        developer: Audinate
        name: Dante Virtual Soundcard
        preinstall_script: |-
          #!/bin/sh
          # Audinate's package suppresses installer dialogs while this marker exists.
          /usr/bin/touch /tmp/DVS_silent_install
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: uninstall_script
        uninstall_script: |-
          #!/bin/sh
          uninstaller="/Library/Application Support/Audinate/DanteVirtualSoundcard/Uninstall DVS.app/Contents/Resources/uninstall.sh"
          if [ ! -f "$uninstaller" ]; then
            echo "Dante Virtual Soundcard uninstaller not found."
            exit 1
          fi
          "$uninstaller"
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
