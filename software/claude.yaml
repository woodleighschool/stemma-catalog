---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: claude
suspend: true
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: claude
  application:
    bundle_id: com.anthropic.claudefordesktop
  signatures:
    - signer: apple:developer-id:Q6L2SF6YDW # Anthropic PBC
  icon: claude
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Claude is Anthropic's AI assistant for writing, analysis, research and coding.
        developer: Anthropic
        name: Claude
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - managed_updates
        exclude: []
