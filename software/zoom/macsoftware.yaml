# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: zoom
spec:
  application:
    bundle_id: us.zoom.xos
    installed_path: /Applications/zoom.us.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - zoom.us.app
        category: Communication
        description: Video meetings and collaboration.
        developer: Zoom Video Communications
        name: Zoom
        unattended_install: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  extends: mac-software
  icon: zoom
  signature:
    signer: apple:developer-id:BJ4HAAB9B3 # Zoom Video Communications, Inc.
  source:
    url: https://zoom.us/client/latest/ZoomInstallerIT.pkg
