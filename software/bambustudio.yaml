# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: bambustudio
spec:
  extends: mac-software
  source:
    resolver: github
    repository: bambulab/BambuStudio
    asset: "*.dmg"
  application:
    bundle_id: com.bambulab.bambu-studio
  signatures:
    - subject:
        bundle_id: com.bambulab.bambu-studio
      signer: apple:developer-id:T3UBR9Y3B2 # Shanghai Lunkuo Technology Co., Ltd
  icon: bambustudio
  destinations:
    woodstar:
      pkginfo:
        category: Graphics & Design
        description: Bambu Studio is an open-source, cutting-edge, feature-rich slicing software. It
          contains project-based workflows, systematically optimized slicing algorithms, and an
          easy-to-use graphical interface, bringing users an incredibly smooth printing experience.
        developer: Bambu Lab
        name: BambuStudio
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
