metadata:
  name: qlab
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: qlab
  application:
    bundle_id: com.figure53.QLab.5
  signatures:
    - signer: apple:developer-id:7672N4CCJM # Figure 53, LLC
  icon: qlab
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: QLab is software for designing and playing back sound, video, lighting and show
          control cues in live performance.
        developer: Figure 53
        name: QLab
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
