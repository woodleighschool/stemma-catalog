# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: safe-exam-browser
spec:
  application:
    bundle_id: org.safeexambrowser.SafeExamBrowser
    installed_path: /Applications/Safe Exam Browser.app
    path: Safe Exam Browser.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Safe Exam Browser.app
        category: Education
        description: Safe Exam Browser provides a secure browser environment for carrying out online assessments.
        developer: ETH Zurich
        minimum_os_version: "12.0"
        name: Safe Exam Browser
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
  extends: mac-software
  icon: safe-exam-browser
  signature:
    signer: apple:developer-id:6F38DNSC7X # Daniel Schneider
  source:
    resolver: github
    repository: SafeExamBrowser/seb-mac
    release: latest
    asset: SafeExamBrowser-*.dmg
