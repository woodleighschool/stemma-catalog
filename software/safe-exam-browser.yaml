# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: safe-exam-browser
spec:
  extends: mac-software
  source:
    resolver: github
    repository: SafeExamBrowser/seb-mac
    release: latest
    asset: SafeExamBrowser-*.dmg
  application:
    path: Safe Exam Browser.app
    bundle_id: org.safeexambrowser.SafeExamBrowser
    installed_path: /Applications/Safe Exam Browser.app
  signatures:
    - subject:
        bundle_id: org.safeexambrowser.SafeExamBrowser
      signer: apple:developer-id:6F38DNSC7X # Daniel Schneider
  minimum_os: "12.0"
  icon: safe-exam-browser
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Safe Exam Browser provides a secure browser environment for carrying out online
          assessments.
        developer: ETH Zurich
        name: Safe Exam Browser
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
