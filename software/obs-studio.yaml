---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: obs-studio
spec:
  extends: mac-software
  source:
    resolver: github
    repository: obsproject/obs-studio
    asset: OBS-Studio-*-macOS-Apple.dmg
  application:
    bundle_id: com.obsproject.obs-studio
  signatures:
    - signer: apple:developer-id:2MMRE5MTB8 # Wizards of OBS LLC
  icon: obs-studio
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: OBS Studio is free and open source software for video recording and live
          streaming.
        developer: OBS Project
        name: OBS Studio
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
