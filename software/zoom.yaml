---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: zoom
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: zoom-for-it-admins
  application:
    bundle_id: us.zoom.xos
    installed_path: /Applications/zoom.us.app
  signatures:
    - signer: apple:developer-id:BJ4HAAB9B3 # Zoom Video Communications, Inc.
  icon: zoom
  destinations:
    woodstar:
      pkginfo:
        category: Communication
        description: Zoom is a cloud-based video conferencing platform that can be used for video
          conferencing meetings, audio conferencing, webinars, meeting recordings, and live chat.
        developer: Zoom
        name: Zoom
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: WindowsSoftware
metadata:
  name: zoom
spec:
  extends: windows-win32
  source:
    resolver: winget
    package: Zoom.Zoom
    architecture: x64
    scope: machine
    installer_type: msi
  version_file: Zoom.exe
  signatures:
    - signer: authenticode:dabb2081eb1d52bf60d812d955f60279629167729ab8fd13708b0f66502e4795 # Zoom Communications, Inc.
  icon: zoom
  destinations:
    intune:
      display_name: Zoom Workplace
      description: Zoom is a cloud-based video conferencing platform that can be used for video
        conferencing meetings, audio conferencing, webinars, meeting recordings, and live chat.
      publisher: &publisher Zoom Communications, Inc.
      developer: *publisher
      information_url: https://www.zoom.com/en/products/collaboration-tools/
      privacy_url: https://www.zoom.com/en/trust/privacy/privacy-statement/
      categories:
        - Collaboration & Social
      msi_properties:
        MSIRestartManagerControl: Disable
        zConfig: AU2_EnableAutoUpdate=true;AU2_SetUpdateChannel=0;AU2_InstallAtIdleTime=true
      assignments:
        - intent: available
          all_devices: true
      detection:
        - type: file
          path: C:\Program Files\Zoom\bin
          name: Zoom.exe
          property: version
