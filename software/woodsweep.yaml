---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: woodsweep
spec:
  source:
    resolver: github
    repository: woodleighschool/woodsweep
    asset: WoodSweep-*.zip
  application:
    bundle_id: au.edu.vic.woodleigh.WoodSweep
  package: {}
  signatures:
    - signer: apple:developer-id:SMLKBTR495 # Woodleigh School
  icon: woodsweep
  destinations:
    intune:
      display_name: WoodSweep
      description: WoodSweep snapshots the logged-in account, resets Microsoft Office user state,
        and reconciles the account home after the snapshot succeeds.
      publisher: &publisher Woodleigh School
      developer: *publisher
      information_url: https://github.com/woodleighschool/woodsweep
      categories:
        - Computer Management
      pre_install_script: null
      post_install_script: |-
        #!/bin/zsh --no-rcs

        exec /Applications/WoodSweep.app/Contents/MacOS/WoodSweep bootstrap \
            --server-url '{{ env.WOODSWEEP_SERVER_URL }}' \
            --bootstrap-user '{{ env.WOODSWEEP_BOOTSTRAP_USER }}' \
            --bootstrap-password '{{ env.WOODSWEEP_BOOTSTRAP_PASSWORD }}'
      ignore_version_detection: false
      assignments:
        - intent: required
          group: ac987f08-8b83-4a09-ba53-5f8e244ce206 # Intune - SAC Macbooks
