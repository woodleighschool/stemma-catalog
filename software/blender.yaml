# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: blender
spec:
  extends: mac-software
  source:
    resolver: blender
    major: 5
    architecture: arm64
  application:
    bundle_id: org.blenderfoundation.blender
  signature:
    signer: apple:developer-id:68UA947AUU # Stichting Blender Foundation
  destinations:
    woodstar:
      pkginfo:
        category: Creativity
        description: Blender is a free and open-source 3D computer graphics software
          tool set used for creating animated films, visual effects, art, 3D-printed
          models, motion graphics, interactive 3D applications, virtual reality, and,
          formerly, video games.
        developer: The Blender Foundation
        name: Blender
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
