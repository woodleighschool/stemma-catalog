# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: woodleigh-fonts
suspend: true
spec:
  destinations:
    woodstar:
      pkginfo:
        category: Fonts
        description: Our managed font bundle.
        developer: Woodleigh
        name: Woodleigh Fonts
        unattended_install: true
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: woodleigh-fonts
      output: installer
