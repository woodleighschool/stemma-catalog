# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: adobe-creative-cloud
spec:
  inputs:
    vendor:
      resolver: homebrew
      cask: adobe-creative-cloud
  signatures:
    - input: vendor
      subject:
        path: Install.app
      signer: apple:developer-id:JQ525L2MZD # Adobe Inc.
  scripts:
    postinstall: |-
      #!/bin/sh
      exec "$(/usr/bin/dirname "$0")/installer/Install.app/Contents/MacOS/Install" --mode=silent
    installer:
      $input: vendor
      path: .
  package:
    identifier: com.github.woodleighschool.pkg.AdobeCreativeCloud
    version: "{{ inputs.vendor.version }}"
