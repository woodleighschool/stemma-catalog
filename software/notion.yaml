---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: notion
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: notion
  application:
    bundle_id: notion.id
  signatures:
    - signer: apple:developer-id:LBQJ96FQ8D # Notion Labs, Incorporated
  icon: notion
  destinations:
    woodstar:
      pkginfo:
        category: Productivity
        description: Notion is a workspace for writing, planning and collaborating, with notes,
          documents, wikis and projects in one place.
        developer: Notion Labs
        name: Notion
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
