# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: google-earth-pro
spec:
  application:
    bundle_id: com.Google.GoogleEarthPro
    installed_path: /Applications/Google Earth Pro.app
    version_key: CFBundleVersion
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Google Earth Pro on desktop is available for users with advanced feature needs.
          Import and export GIS data, and go back in time with historical imagery. Available on PC,
          Mac, or Linux.
        developer: Google
        name: Google Earth Pro
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
  extends: mac-software
  icon: google-earth-pro
  package_path: Install Google Earth Pro *.pkg
  signature:
    signer: apple:developer-id:EQHXZ8M8AV # Google LLC
  source:
    url: https://dl.google.com/dl/earth/client/advanced/current/googleearthpromac-intel.dmg
