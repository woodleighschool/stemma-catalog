---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: arduino-ide
spec:
  extends: mac-software
  source:
    resolver: github
    repository: arduino/arduino-ide
    asset: arduino-ide_*_macOS_arm64.dmg
  application:
    path: Arduino IDE.app
    bundle_id: cc.arduino.IDE2
  signatures:
    - signer: apple:developer-id:7KT7ZWMCJT # ARDUINO SA
  icon: arduino-ide
  destinations:
    woodstar:
      pkginfo:
        category: Developer Tools
        description: Arduino IDE is an editor for writing, compiling and uploading code to Arduino boards.
        developer: Arduino
        name: Arduino IDE
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
