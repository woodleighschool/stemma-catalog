# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-word
spec:
  application:
    bundle_id: com.microsoft.Word
    installed_path: /Applications/Microsoft Word.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft AutoUpdate
          - Microsoft Error Reporting
          - Microsoft Word
        category: Productivity
        description: Create and edit professional-looking documents with ease, whether it's for
          business reports, academic papers, or personal projects.
        developer: Microsoft
        name: Microsoft Word
        unattended_install: true
        uninstallable: false
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
  extends: mac-software
  icon: microsoft-word
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  source:
    resolver: microsoft
    product: word
