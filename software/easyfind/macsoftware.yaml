# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: easyfind
spec:
  application:
    path: EasyFind.app
  destinations:
    woodstar:
      pkginfo:
        category: Utilities
        description: Spotlight is great, but sometimes you need something more specialized. EasyFind
          finds files and folders by name, content, tags, or comments using advanced Boolean
          operators, wildcards, phrases, even regular expressions. It does not require indexing, is
          fast, and uses very little memory.
        developer: DEVONtechnologies
        name: EasyFind
        unattended_install: true
  extends: mac-software
  signature:
    signer: apple:developer-id:679S2QUWR8 # DEVONtechnologies, LLC
  source:
    config:
      match: https://[^"\s]+EasyFind\.app\.zip
      url: https://www.devontechnologies.com/apps/freeware
    resolver: http
