# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: numbers
suspend: true
spec:
  extends: mac-software
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Numbers
        category: Productivity
        description: Numbers is Apple's spreadsheet app for creating tables, charts,
          and collaborative workbooks.
        developer: Apple
        name: Numbers
        preinstall_script: |-
          #!/bin/zsh --no-rcs

          /bin/rm -rf "/Applications/Numbers.app"
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  source:
    path: /Applications/Numbers Creator Studio.app
  application:
    installed_path: "/Applications/Numbers Creator Studio.app"
