# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: unity-hub
spec:
  application:
    bundle_id: com.unity3d.unityhub
    path: Unity Hub.app
  destinations:
    woodstar:
      pkginfo:
        category: Programming
        description: Unity Hub manages Unity installs, templates, and projects so students can
          quickly switch between versions and collaborate on creations.
        developer: Unity Technologies
        name: Unity Hub
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
  extends: mac-software
  source:
    filename: UnityHub.dmg
    url: https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup-arm64.dmg
  verification:
    integrity: true
    signature: true
    subject: application
