# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: godot
spec:
  application:
    bundle_id: org.godotengine.godot
    path: Godot.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Godot.app
        category: Programming
        description: >-
          Godot is a free and open-source game development engine for 2D and 3D games,
          with a scene and node structure that can be extended with GDScript.
        developer: Godot Foundation
        name: Godot
        unattended_install: true
        unattended_uninstall: true
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  extends: mac-software
  icon: godot
  signature:
    signer: apple:developer-id:6K46PWY5DM # Prehensile Tales B.V.
  source:
    match: https://downloads\.godotengine\.org/\?version=4\.[0-9.]+&flavor=stable&slug=macos\.universal\.zip&platform=macos\.universal
    url: https://godotengine.org/download/macos/
