# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: godot
spec:
  extends: mac-software
  source:
    resolver: github
    repository: godotengine/godot-builds
    release: 4.*-stable
    asset: Godot_v*-stable_macos.universal.zip
  application:
    path: Godot.app
    bundle_id: org.godotengine.godot
  signatures:
    - subject:
        path: Godot.app
      signer: apple:developer-id:6K46PWY5DM # Prehensile Tales B.V.
  icon: godot
  destinations:
    woodstar:
      pkginfo:
        category: Developer Tools
        description: Godot is a free and open-source game development engine for 2D and 3D games,
          with a scene and node structure that can be extended with GDScript.
        developer: Godot Foundation
        name: Godot
        unattended_install: true
        unattended_uninstall: true
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
