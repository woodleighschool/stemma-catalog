# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: linewize-authentication-agent
suspend: true
spec:
  extends: mac-software
  source:
    path: Assets/auth-agent.pkg
  signatures:
    - signer: apple:developer-id:5S77G864UH # B Communications Pty Ltd
  destinations:
    woodstar:
      pkginfo:
        category: Security
        description: The Linewize Authentication Agent identifies the signed-in user so Linewize
          Filter can determine which filtering rules apply.
        developer: Qoria
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          agent=/opt/FamilyZone/AuthenticationAgent/bin/fc-authentication-agent_darwin-amd64
          [[ -x $agent ]] && /usr/bin/pgrep -qf "$agent" && exit 1
          exit 0
        installs:
          - path: /opt/FamilyZone/AuthenticationAgent/bin/fc-authentication-agent_darwin-amd64
            type: file
        name: Linewize Authentication Agent
        requires:
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        uninstallable: false
        version: 1.4.1
      targets:
        include: []
        exclude: []
---
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: linewize-connect
suspend: true
spec:
  extends: mac-software
  source:
    url: https://qoria-mza-installers.linewize.net/Connect%20Installer.pkg
  signatures:
    - signer: apple:developer-id:5S77G864UH # FAMILY ZONE CYBER SAFETY LIMITED
  destinations:
    woodstar:
      pkginfo:
        category: Security
        description: Linewize Connect is the endpoint agent used by Linewize Filter to provide
          filtering and classroom controls.
        developer: Qoria
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          service=/Applications/FamilyZone/MobileZoneAgent/bin/fc-system-service_darwin-amd64
          [[ -x $service ]] && /usr/bin/pgrep -qf "$service" && exit 1
          exit 0
        name: Linewize Connect
        preinstall_script: |-
          #!/bin/zsh --no-rcs

          app=/Applications/FamilyZone/MobileZoneAgent/bin/Connect.app
          if [[ -d $app ]]; then
              /usr/bin/chflags -R noschg "$app"
          fi
        requires:
          - resource:
              kind: MacSoftware
              name: linewize-authentication-agent
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Students
            actions:
              - managed_installs
          - label_name: CRT/Spare Shared MacBooks
            actions:
              - managed_installs
          - label_name: SAC MacBooks
            actions:
              - managed_installs
        exclude: []
