---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: linewize-authentication-agent
suspend: true
spec:
  extends: mac-software
  source:
    path: Assets/auth-agent.pkg
  signatures:
    - signer: apple:developer-id:5S77G864UH # B Communications Pty Ltd
  icon: linewize-authentication-agent
  destinations:
    woodstar:
      pkginfo:
        category: Security
        description: The Linewize Authentication Agent identifies the signed-in user so Linewize
          Filter can determine which filtering rules apply.
        developer: Qoria
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          agent=/opt/FamilyZone/AuthenticationAgent/bin/fc-authentication-agent_darwin-amd64
          [[ -x $agent ]] && /usr/bin/pgrep -qf "$agent" && exit 1
          exit 0
        installs:
          - path: /opt/FamilyZone/AuthenticationAgent/bin/fc-authentication-agent_darwin-amd64
            type: file
        name: Linewize Authentication Agent
        requires:
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        uninstallable: false
        version: 1.4.1
      targets:
        include: []
        exclude: []
