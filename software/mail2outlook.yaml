# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: mail2outlook
spec:
  extends: mac-software
  icon: mail2outlook
  destinations:
    woodstar:
      pkginfo:
        category: System
        description: Sets Microsoft Outlook as the default app for email links.
        developer: Woodleigh School
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          [[ -d "/Applications/Microsoft Outlook.app" ]] || exit 1

          user=$(/usr/bin/stat -f %Su /dev/console)
          case $user in
              root | loginwindow | _mbsetupuser | "") exit 1 ;;
          esac

          handler=$(
              /bin/launchctl asuser "$(/usr/bin/id -u "$user")" /usr/bin/sudo -u "$user" \
                  /usr/bin/osascript -l JavaScript -e 'ObjC.import("CoreServices"); ObjC.unwrap(ObjC.castRefToObject($.LSCopyDefaultHandlerForURLScheme($("mailto"))))' 2> /dev/null
          ) || exit 0
          [[ $handler == com.microsoft.Outlook ]] && exit 1
          exit 0
        installer_type: nopkg
        name: Mail2Outlook
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          user=$(/usr/bin/stat -f %Su /dev/console)
          case $user in
              root | loginwindow | _mbsetupuser | "") exit 1 ;;
          esac

          result=$(
              /bin/launchctl asuser "$(/usr/bin/id -u "$user")" /usr/bin/sudo -u "$user" \
                  /usr/bin/osascript -l JavaScript -e 'ObjC.import("CoreServices"); $.LSSetDefaultHandlerForURLScheme($("mailto"), $("com.microsoft.Outlook"))'
          )
          [[ $result == 0 ]]
        unattended_install: true
        uninstallable: false
        update_for:
          - resource:
              kind: MacSoftware
              name: microsoft-365-business-pro-suite
          - resource:
              kind: MacSoftware
              name: microsoft-outlook
        version: "1.0"
      targets:
        include: []
        exclude: []
