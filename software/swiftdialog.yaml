# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: swiftdialog
spec:
  extends: mac-software
  source:
    resolver: github
    repository: swiftDialog/swiftDialog
    asset: dialog-*-*.pkg
  application:
    path: tmp-package.pkg/Payload/Library/Application Support/Dialog/Dialog.app
    installed_path: "/Library/Application Support/Dialog/Dialog.app"
  signature:
    signer: apple:developer-id:PWA5E9TQ59 # Commonwealth Scientific and Industrial Research Organisation
  minimum_os: "15.0"
  icon: swiftdialog
  destinations:
    intune:
      display_name: swiftDialog
      description: swiftDialog is an open source admin utility for macOS 12 or later
        written in SwiftUI that presents custom dialogs, displays informative messages
        or can be used as a form to request user input.
      publisher: CSIRO
      ignore_version_detection: true
      assignments:
        - intent: required
          all_devices: true
      retention:
        keep: 1
    woodstar:
      pkginfo:
        category: Utilities
        description: swiftDialog is an open source admin utility for macOS 12 or later
          written in SwiftUI that presents custom dialogs, displays informative messages
          or can be used as a form to request user input.
        developer: CSIRO
        name: swiftDialog
        unattended_install: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude: []
