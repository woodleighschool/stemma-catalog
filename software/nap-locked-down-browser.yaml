# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: nap-locked-down-browser
spec:
  extends: mac-software
  source:
    url: https://www.assessform.edu.au/naplan-online/locked-down-browser
    match: https://[^"\s]+\.pkg
  application:
    bundle_id: au.com.janison.mac.naplan
    installed_path: /Applications/NAP Locked down browser.app
  signature:
    signer: apple:developer-id:KU9HRE5GET # Janison
  minimum_os: "14.0"
  icon: nap-locked-down-browser
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - NAP Locked down browser
          - NAP Locked down browser Uninstaller
        category: Education
        description: The NAP Locked down browser lets students securely participate in NAPLAN and
          NAP Sample tests by preventing access to other applications and unauthorised device
          resources during an assessment.
        developer: ACARA
        name: NAP Locked down browser
        requires:
          - resource:
              kind: MacSoftware
              name: rosetta
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: SAC MacBooks
            actions:
              - managed_installs
          - label_name: NAPLAN Students
            actions:
              - managed_installs
        exclude: []
