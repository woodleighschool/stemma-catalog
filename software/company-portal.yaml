# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: company-portal
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: company-portal
  application:
    bundle_id: com.microsoft.CompanyPortalMac
    installed_path: /Applications/Company Portal.app
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  minimum_os: "14.0"
  icon: company-portal
  destinations:
    intune:
      display_name: Company Portal
      description: The Company Portal provides access to corporate apps and resources from almost
        any network. Your company must already subscribe to Microsoft Intune, and your IT admin
        must set up your account before you can use this app.
      publisher: Microsoft
      ignore_version_detection: true
      included_apps:
        - id: "{{ evidence['macos.application'].app.bundle_id }}"
          version: "{{ evidence['macos.application'].app.version }}"
      assignments:
        - intent: required
          all_devices: true
      retention:
        keep: 1
    woodstar:
      pkginfo:
        category: Productivity
        description: The Company Portal provides access to corporate apps and resources from almost
          any network. Your company must already subscribe to Microsoft Intune, and your IT admin
          must set up your account before you can use this app.
        developer: Microsoft
        name: Company Portal
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
