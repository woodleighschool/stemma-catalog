# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: company-portal
spec:
  extends: mac-software
  source:
    resolver: microsoft
    product: company-portal
  application:
    bundle_id: com.microsoft.CompanyPortalMac
    installed_path: /Applications/Company Portal.app
  signatures:
    - subject:
        path: .
      signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  minimum_os: "14.0"
  icon: company-portal
  destinations:
    intune:
      display_name: Company Portal
      description: &description The Company Portal provides access to corporate apps and resources
        from almost any network. Your company must already subscribe to Microsoft Intune, and your
        IT admin must set up your account before you can use this app.
      publisher: &publisher Microsoft
      developer: *publisher
      information_url: https://learn.microsoft.com/en-us/intune/user-help/
      privacy_url: https://www.microsoft.com/en-us/privacy/privacystatement
      categories:
        - Other Apps
      ignore_version_detection: true
      assignments:
        - intent: required
          all_devices: true
    woodstar:
      pkginfo:
        category: System
        description: *description
        developer: *publisher
        name: Company Portal
        unattended_install: true
        uninstallable: false
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
