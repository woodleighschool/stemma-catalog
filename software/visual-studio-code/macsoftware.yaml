# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: visual-studio-code
spec:
  application:
    bundle_id: com.microsoft.VSCode
    installed_path: /Applications/Visual Studio Code.app
    path: Visual Studio Code.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Visual Studio Code.app
        category: Programming
        description: Code editor with integrated debugging and extensions.
        developer: Microsoft
        name: Visual Studio Code
        postinstall_script: |-
          #!/bin/bash
          mkdir -p /usr/local/bin || exit 1
          ln -sf "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" /usr/local/bin/code
        postuninstall_script: |-
          #!/bin/bash
          rm -f /usr/local/bin/code
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
  extends: mac-software
  source:
    filename: Visual Studio Code.dmg
    url: https://code.visualstudio.com/sha/download?build=stable&os=darwin-arm64-dmg
  verification:
    integrity: true
    signature: true
    subject: application
