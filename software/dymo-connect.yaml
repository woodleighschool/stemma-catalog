# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: dymo-connect
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: dymo-connect
  application:
    path: dymo-connect.pkg/Payload/Applications/DYMO Connect.app
    installed_path: /Applications/DYMO Connect.app
  signatures:
    - subject:
        path: .
      signer: apple:developer-id:N3S6676K3E # Sanford, L.P.
  icon: dymo-connect
  destinations:
    woodstar:
      pkginfo:
        category: Printing
        description: Design and print labels with DYMO Connect for DYMO LabelWriter and LabelManager
          label printers.
        developer: DYMO
        name: DYMO Connect
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - optional_installs
              - managed_updates
        exclude: []
