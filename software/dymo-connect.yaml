---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: dymo-connect
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: dymo-connect
  application:
    bundle_id: com.dymo.dymo-connect
  signatures:
    - signer: apple:developer-id:N3S6676K3E # Sanford, L.P.
  icon: dymo-connect
  destinations:
    woodstar:
      pkginfo:
        category: Printing
        description: DYMO Connect is software for designing and printing labels on DYMO LabelWriter
          and LabelManager label makers.
        developer: DYMO
        name: DYMO Connect
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Staff
            actions:
              - optional_installs
              - managed_updates
        exclude: []
