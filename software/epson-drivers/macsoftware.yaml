# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: epson-drivers
spec:
  extends: mac-software
  destinations:
    woodstar:
      pkginfo:
        blocking_applications: []
        category: Utilities
        description: Installs the Epson AM-C6000 Series printer driver.
        developer: Epson
        name: EPSON Drivers
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
        version:
          "$fact": epson.version
        installs:
          - type: bundle
            path: "/Library/Printers/EPSON/InkjetPrinter2/SupportPrinters/AM-C6000 Series.data"
            CFBundleIdentifier: com.epson.ijprinter.data.AM-C6000 Series
            CFBundleName: AM-C6000 Series
            CFBundleShortVersionString:
              "$fact": epson.version
      targets:
        exclude: []
        include:
          - actions:
              - managed_updates
            label_name: All Hosts
  source:
    resolver: epson
    device_id: AM-C6000 Series
    os: MAC26
    region: GB
    cti: "2001"
  signature:
    signer: apple:developer-id:TXAEAV5RN4
  package_path: EPSON Printer.pkg
  icon: epson-drivers
