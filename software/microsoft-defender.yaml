# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-defender
spec:
  application:
    bundle_id: com.microsoft.wdav
    installed_path: /Applications/Microsoft Defender.app
  destinations:
    woodstar:
      pkginfo:
        category: Security
        description: Microsoft Defender for Endpoint helps prevent, detect, investigate, and respond
          to threats across devices.
        developer: Microsoft
        name: Microsoft Defender
        unattended_install: true
        uninstallable: false
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: Defender Test
  extends: mac-software
  icon: microsoft-defender
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  source:
    resolver: microsoft
    product: defender
