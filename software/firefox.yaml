# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: firefox
spec:
  extends: mac-software
  source:
    url: https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US
  application:
    bundle_id: org.mozilla.firefox
  signatures:
    - subject:
        path: Firefox.app
      signer: apple:developer-id:43AQ936H96 # Mozilla Corporation
  icon: firefox
  destinations:
    woodstar:
      pkginfo:
        category: Internet
        description: Firefox is a free, open source web browser from Mozilla, focused
          on speed, privacy and standards compliance. Alternate browser option for
          end-users.
        developer: Mozilla
        name: Firefox
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
