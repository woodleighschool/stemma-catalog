# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: keynote
suspend: true
spec:
  extends: mac-software
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Keynote
        category: Productivity
        description: Keynote is Apple's presentation app for creating and delivering
          presentations.
        developer: Apple
        name: Keynote
        preinstall_script: |-
          #!/bin/zsh --no-rcs

          /bin/rm -rf "/Applications/Keynote.app"
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  source:
    path: /Applications/Keynote Creator Studio.app
  application:
    installed_path: "/Applications/Keynote Creator Studio.app"
