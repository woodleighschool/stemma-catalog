---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: unity-hub
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: unity-hub
  application:
    path: Unity Hub.app
    bundle_id: com.unity3d.unityhub
  signatures:
    - signer: apple:developer-id:9QW8UQUTAA # Unity Technologies SF
  icon: unity-hub
  destinations:
    woodstar:
      pkginfo:
        category: Developer Tools
        description: Unity Hub manages Unity Editor installations and projects, making it easy to
          install and switch between Editor versions.
        developer: Unity Technologies
        name: Unity Hub
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
