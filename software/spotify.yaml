---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: spotify
spec:
  extends: mac-software
  source:
    url: https://download.scdn.co/SpotifyARM64.dmg
  application:
    path: Spotify.app
    bundle_id: com.spotify.client
    installed_path: /Applications/Spotify.app
  signatures:
    - signer: apple:developer-id:2FNC3A47ZF # Spotify
  icon: spotify
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: Spotify is a digital music service that gives you access to millions of songs.
        developer: Spotify
        name: Spotify
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          setopt errexit

          /bin/chmod -R go+rX /Applications/Spotify.app

          user=$(/usr/bin/stat -f %Su /dev/console)
          case $user in
              root | loginwindow | _mbsetupuser | "") exit 0 ;;
          esac

          /usr/bin/sudo -H -u "$user" /bin/zsh --no-rcs <<'EOF'
          setopt errexit

          update="$HOME/Library/Application Support/Spotify/PersistentCache/Update"
          [[ ! -L $update ]] || exit 1
          /bin/mkdir -p "$update"
          /usr/bin/chflags -R -P nouchg "$update"
          /bin/rm -rf -- "$update"/*(DN)
          /usr/bin/chflags uchg "$update"
          EOF
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
