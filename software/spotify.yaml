# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: spotify
spec:
  application:
    bundle_id: com.spotify.client
    installed_path: /Applications/Spotify.app
    path: Spotify.app
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: Spotify is a digital music service that gives you access to millions of songs.
        developer: Spotify
        name: Spotify
        postinstall_script: |-
          #!/bin/bash
          /bin/chmod -R go+rX /Applications/Spotify.app
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
  extends: mac-software
  icon: spotify
  signature:
    signer: apple:developer-id:2FNC3A47ZF # Spotify
  source:
    url: https://download.scdn.co/SpotifyARM64.dmg
