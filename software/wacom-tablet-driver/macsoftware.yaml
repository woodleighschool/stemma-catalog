# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: wacom-tablet-driver
spec:
  application:
    bundle_id: com.wacom.WacomCenter
    installed_path: /Applications/Wacom Tablet.localized/Wacom Center.app
    version_key: CFBundleVersion
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Wacom Center
          - Wacom Display Settings
          - Wacom Tablet Utility
        category: Creativity
        description: Drivers and settings for Wacom pen tablets and displays.
        developer: Wacom
        name: Wacom Tablet Driver
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
  extends: mac-software
  package_path: Install Wacom Tablet.pkg
  source:
    filename: WacomTablet.dmg
    match: https://cdn\.wacom\.com/u/productsupport/drivers/mac/professional/WacomTablet_[0-9]+(?:\.[0-9]+)*(?:-[0-9]+)?\.dmg
    url: https://www.wacom.com/en-us/support/product-support/drivers
  verification:
    integrity: true
    signature: true
    subject: installer
