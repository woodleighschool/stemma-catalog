---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: mole
spec:
  extends: mac-software
  source:
    resource:
      kind: BuildMacPkg
      name: mole
  destinations:
    woodstar:
      pkginfo:
        name: Mole
        category: Utilities
        description: Terminal tools for inspecting disk usage, monitoring system health and cleaning a Mac.
        developer: tw93
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
