---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: BuildMacPkg
metadata:
  name: mole
spec:
  inputs:
    mole:
      resolver: homebrew
      formula: mole
      macos: "27"
  package:
    identifier: com.github.woodleighschool.pkg.Mole
    version: "{{ inputs.mole.version }}"
  payload:
    /usr/local/libexec/mole:
      $input: mole
    /usr/local/bin/mole:
      symlink: ../libexec/mole/bin/mole
    /usr/local/bin/mo:
      symlink: ../libexec/mole/bin/mo
