# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: minecraft-education
spec:
  application:
    bundle_id: com.microsoft.minecraft-edu
    path: minecraft-edu.app
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Engage students in game-based learning across the curriculum. Minecraft
          Education is a game-based platform that inspires creative, inclusive learning through
          play. Explore blocky words that unlock new ways to take on any subject or challenge.
        developer: Microsoft
        name: Minecraft Education
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: remove_copied_items
        uninstallable: true
  extends: mac-software
  signature:
    signer: apple:developer-id:UBF8T346G9 # Microsoft Corporation
  source:
    url: https://aka.ms/meeclientmacos
