# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: assetcache-exporter
spec:
  source:
    resolver: github
    repository: woodleighschool/assetcache-exporter
    asset: assetcache-exporter-*.pkg
  signature:
    signer: apple:developer-id:SMLKBTR495 # Woodleigh School
  minimum_os: "11.0"
  destinations:
    intune:
      type: pkg
      display_name: assetcache-exporter
      description: assetcache-exporter exposes Apple Content Caching metrics for Prometheus.
      publisher: Woodleigh School
      ignore_version_detection: false
      assignments:
        - intent: required
          group: 88208ef5-07a0-4627-ad8f-e9c1c0ff5f15 # Intune - Apple Content Caches
      retention:
        keep: 1
