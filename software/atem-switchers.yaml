---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: atem-switchers
spec:
  extends: mac-software
  source:
    resolver: blackmagic
    product: ATEM Switchers
    name_pattern: '^ATEM Switchers (?P<version>[0-9]+(?:\.[0-9]+)*) Update$'
  package_path: Install ATEM *.pkg
  signatures:
    - signer: apple:developer-id:9ZGFBWLSYP # Blackmagic Design Inc
  icon: atem-switchers
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - ATEM Software Control
          - ATEM Setup
        category: Media
        description: ATEM Software Control operates Blackmagic ATEM switchers from a Mac, with
          switching, audio mixing, the media pool, camera control and macros. ATEM Setup updates and
          configures the switchers.
        developer: Blackmagic Design
        name: ATEM Switchers
        unattended_install: true
        unattended_uninstall: true
        version: "{{ facts['Switchers.pkg/PackageInfo'].package.version }}"
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
        exclude: []
