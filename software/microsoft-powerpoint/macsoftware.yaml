# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma/refs/heads/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: microsoft-powerpoint
spec:
  application:
    bundle_id: com.microsoft.Powerpoint
    installed_path: /Applications/Microsoft PowerPoint.app
  destinations:
    woodstar:
      pkginfo:
        blocking_applications:
          - Microsoft AutoUpdate
          - Microsoft Error Reporting
          - Microsoft PowerPoint
        category: Productivity
        description: Design impactful presentations with stunning visuals and engaging content to
          captivate your audience.
        developer: Microsoft
        name: Microsoft PowerPoint
        unattended_install: true
        uninstallable: false
  extends: mac-software
  source:
    filename: MicrosoftPowerPoint.pkg
    url: https://go.microsoft.com/fwlink/?linkid=525136
  verification:
    integrity: true
    signature: true
    subject: source
