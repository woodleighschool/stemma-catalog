# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: rosetta
spec:
  extends: mac-software
  minimum_os: "11.0"
  icon: rosetta
  destinations:
    woodstar:
      pkginfo:
        category: System
        description: Installs Rosetta, Apple's translation technology for running Intel-based apps
          on Apple silicon Macs.
        developer: Apple
        installcheck_script: |-
          #!/bin/zsh --no-rcs

          [[ $(/usr/bin/arch) == arm64 ]] || exit 1
          /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null && exit 1
          exit 0
        installer_type: nopkg
        name: Rosetta
        postinstall_script: |-
          #!/bin/zsh --no-rcs

          /usr/sbin/softwareupdate --install-rosetta --agree-to-license
        unattended_install: true
        uninstallable: false
        version: "1.0"
      targets:
        include:
          - label_name: All Hosts
            actions:
              - managed_installs
        exclude: []
