# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: rosetta
spec:
  minimum_os: "11.0"
  destinations:
    woodstar:
      pkginfo:
        category: System
        description: Installs Apple's Rosetta translation software on Apple silicon Macs.
        developer: Apple
        installcheck_script: |
          #!/bin/sh
          [ "$(/usr/bin/arch)" = arm64 ] || exit 1
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null && exit 1
          exit 0
        installer_type: nopkg
        name: Rosetta
        postinstall_script: |
          #!/bin/sh
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license
        unattended_install: true
        uninstallable: false
        version: "1.0"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: All Hosts
  extends: mac-software
  icon: rosetta
