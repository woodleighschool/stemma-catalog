---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: letos
spec:
  extends: mac-software
  source:
    resolver: github
    repository: pawelsalawa/letos
    asset: letos-*-macos-universal.dmg
  application:
    path: Letos.app
    bundle_id: org.letos.Letos
  signatures:
    - signer: apple:developer-id:985DVLRM9G # Pawel Salawa
  icon: letos
  destinations:
    woodstar:
      pkginfo:
        category: Developer Tools
        description: Letos, formerly SQLiteStudio, is a free and open-source tool to create, edit
          and browse SQLite databases.
        developer: Letos
        name: Letos
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
