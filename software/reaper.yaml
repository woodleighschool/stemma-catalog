---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: reaper
spec:
  extends: mac-software
  source:
    resolver: homebrew
    cask: reaper
  application:
    bundle_id: com.cockos.reaper
  signatures:
    - signer: apple:developer-id:Y3T58622SG # Cockos Incorporated
  icon: reaper
  destinations:
    woodstar:
      pkginfo:
        category: Media
        description: REAPER is a complete digital audio production application, offering a full
          multitrack audio and MIDI recording, editing, processing, mixing and mastering toolset.
        developer: Cockos
        name: REAPER
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
