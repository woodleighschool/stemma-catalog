# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: gamemaker
spec:
  extends: mac-software
  source:
    url: https://gamemaker.io/en/download/mac/monthly/GameMaker.pkg
  application:
    bundle_id: com.yoyogames.gms2
  signature:
    signer: apple:developer-id:C9E7J7HL3D # YoYo Games Ltd
  icon: gamemaker
  destinations:
    woodstar:
      pkginfo:
        category: Programming
        description: GameMaker makes designing games easy, regardless of your background or skill
          level. All you need is an idea!
        developer: YoYo Games
        name: GameMaker
        unattended_install: true
        unattended_uninstall: true
        uninstall_method: removepackages
        uninstallable: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
