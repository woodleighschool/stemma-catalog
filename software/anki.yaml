---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: MacSoftware
metadata:
  name: anki
suspend: true
spec:
  extends: mac-software
  source:
    resolver: github
    repository: ankitects/anki
    asset: anki-*-mac-apple.dmg
  application:
    bundle_id: net.ankiweb.anki
  signatures:
    - signer: apple:developer-id:ZL66D3NMZM # Anki Software LLC
  icon: anki
  destinations:
    woodstar:
      pkginfo:
        category: Education
        description: Anki is a flashcard program that helps you spend more time on challenging
          material, and less on what you already know.
        developer: Anki Software
        name: Anki
        unattended_install: true
        unattended_uninstall: true
      targets:
        include:
          - label_name: All Hosts
            actions:
              - optional_installs
              - managed_updates
        exclude: []
