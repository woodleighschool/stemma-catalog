monorepo_root = true

[env]
_.file = ["{{config_root}}/.env"]

[tools]
"github:woodleighschool/stemma" = "0.2.1"
oxfmt = "0.67.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["plugins/*"]

[tasks.schema]
description = "Generate the editor schema from the local Stemma registry"
depends = ["//plugins/downloads:build"]
run = "stemma schema --offline --output-file stemma.schema.json"
