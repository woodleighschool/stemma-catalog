monorepo_root = true

[env]
_.file = ["{{config_root}}/.env"]

[tools]
"github:woodleighschool/stemma" = "v0.12.3"
lefthook = "2.2.2"
jactionlint = "2.4.0"
"github:github/gh-aw" = { version = "v1.0.1", bin = "gh-aw" }
oxfmt = "0.75.0"

[settings]
experimental = true
pin = true
lockfile = true
minimum_release_age_excludes = ["github:woodleighschool/stemma"]

[monorepo]
config_roots = ["plugins/*"]

[tasks.schema]
description = "Generate the editor schema with the pinned Stemma CLI"
run = "stemma schema --output-file stemma.schema.json"

[tasks.aw]
description = "Compile the agentic workflows"
run = "gh-aw compile"

[tasks.format]
run = "oxfmt"

[tasks.fmt-check]
run = "oxfmt --check"

[hooks]
postinstall = "lefthook install"
