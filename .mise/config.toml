monorepo_root = true

[env]
_.file = ["{{config_root}}/.env"]

[tools]
"github:woodleighschool/stemma" = "0.3.0"
lefthook = "2.1.14"
actionlint = "1.7.12"
zizmor = "1.30.1"
oxfmt = "0.70.0"
"npm:@commitlint/cli" = "21.2.3"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["plugins/*"]

[tasks.schema]
description = "Generate the editor schema from the local Stemma registry"
depends = ["//plugins/downloads:build"]
run = "stemma schema --offline --output-file stemma.schema.json"

[tasks.format]
description = "Format YAML, JSON and Markdown"
run = "oxfmt"

[tasks.fmt-check]
description = "Check YAML, JSON and Markdown formatting"
run = "oxfmt --check"

[hooks]
postinstall = "lefthook install"
