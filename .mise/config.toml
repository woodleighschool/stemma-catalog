monorepo_root = true

[env]
_.file = ["{{config_root}}/.env"]

[tools]
"github:woodleighschool/stemma" = "v0.12.1"
lefthook = "2.2.2"
"aqua:jdx/jactionlint" = "2.3.0"
"github:github/gh-aw" = { version = "v0.93.5", bin = "gh-aw" }
oxfmt = "0.74.0"
"npm:@commitlint/cli" = "21.2.4"

[settings]
experimental = true
pin = true
lockfile = true
minimum_release_age_excludes = ["github:woodleighschool/stemma"]

[monorepo]
config_roots = ["plugins/*"]

[tasks.schema]
description = "Generate the editor schema using the pinned Stemma release"
run = "stemma schema --output-file stemma.schema.json"

[tasks.aw]
description = "Compile the agentic workflows"
run = "gh-aw compile"

[tasks.format]
description = "Format YAML, JSON and Markdown"
run = "oxfmt"

[tasks.fmt-check]
description = "Check YAML, JSON and Markdown formatting"
run = "oxfmt --check"

[hooks]
postinstall = "lefthook install"
