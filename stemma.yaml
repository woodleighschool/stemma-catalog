# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: Project
metadata:
  name: woodleigh-catalog
spec:
  imports:
    - software/**/*.yaml
  plugins:
    downloads:
      image: ghcr.io/woodleighschool/stemma-catalog/downloads:0.3.7@sha256:58ce98a35f6b4b3ff980fee16d0803d1580353d63070ac3b5004020883a7ca8c
    woodstar:
      image: ghcr.io/woodleighschool/woodstar/stemma:1.1.0@sha256:2d802e06f785a12c2065c02c9feda7461ff3ba51e615cf09788c5fdb7db07343
  components:
    mac-software:
      destinations:
        woodstar:
          retention:
            keep: 1
    windows-win32:
      destinations:
        intune:
          architectures:
            - x64
          minimum_windows_release: Windows11_24H2
          install_experience:
            run_as: system
            restart: based_on_return_code
          return_codes:
            - code: 0
              type: success
            - code: 1707
              type: success
            - code: 3010
              type: soft_reboot
            - code: 1641
              type: hard_reboot
            - code: 1618
              type: retry
  destinations:
    intune:
      operation: intune
      config:
        client_id: "{{ env.INTUNE_CLIENT_ID }}"
        client_secret: "{{ env.INTUNE_CLIENT_SECRET }}"
        tenant_id: "{{ env.INTUNE_TENANT_ID }}"
    woodstar:
      operation: woodstar
      config:
        api_key: "{{ env.WOODSTAR_API_KEY }}"
        url: https://woodstar.woodleigh.vic.edu.au
  reconcile:
    source_control:
      type: github
      config:
        client_id: "{{ env.GITHUB_APP_CLIENT_ID }}"
        installation_id: "{{ env.GITHUB_APP_INSTALLATION_ID }}"
        private_key: "{{ env.GITHUB_APP_PRIVATE_KEY }}"
