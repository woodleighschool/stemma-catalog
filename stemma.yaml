# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: Project
metadata:
  name: woodleigh-catalog
spec:
  imports:
    - software/**/*.yaml
  plugins:
    downloads:
      image: ghcr.io/woodleighschool/stemma-catalog/downloads:0.3.1@sha256:69795fd6d4abc28c7538a23067e3f9418454fdc12ba7daf6e57a9437605f0a6e
      trusted: true
    woodstar:
      image: ghcr.io/woodleighschool/woodstar/stemma:dev-35f5460f-20260926122511@sha256:f48831ae23acca9c54b530d4f060cde8db1e0e74436d3e3353e14606567617fb
      trusted: true
  components:
    mac-software:
      destinations:
        woodstar:
          retention:
            keep: 1
    windows-win32:
      destinations:
        intune:
          architectures:
            - x64
          minimum_windows_release: Windows11_24H2
          install_experience:
            run_as: system
            restart: based_on_return_code
          return_codes:
            - code: 0
              type: success
            - code: 1707
              type: success
            - code: 3010
              type: soft_reboot
            - code: 1641
              type: hard_reboot
            - code: 1618
              type: retry
          retention:
            keep: 1
  destinations:
    intune:
      operation: intune
      config:
        client_id: "{{ env.INTUNE_CLIENT_ID }}"
        client_secret: "{{ env.INTUNE_CLIENT_SECRET }}"
        tenant_id: "{{ env.INTUNE_TENANT_ID }}"
    woodstar:
      operation: woodstar.munki
      config:
        api_key: "{{ env.WOODSTAR_API_KEY }}"
        url: https://woodstar.woodleigh.vic.edu.au
  reconcile:
    source_control:
      type: github
      config:
        client_id: "{{ env.GITHUB_APP_CLIENT_ID }}"
        installation_id: "{{ env.GITHUB_APP_INSTALLATION_ID }}"
        private_key: "{{ env.GITHUB_APP_PRIVATE_KEY }}"
