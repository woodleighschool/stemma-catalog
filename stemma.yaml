---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: Project
metadata:
  name: woodleigh-catalog
spec:
  imports:
    - software/**/*.yaml
  plugins:
    downloads:
      image: ghcr.io/woodleighschool/stemma-catalog/downloads:0.3.19@sha256:866067df0d1307dca4ca9755461e048bd21c0654e1fe2d662a1733ce2ea77430
    fleetd:
      image: ghcr.io/woodleighschool/stemma-catalog/fleetd:0.3.20@sha256:69a139ba5b5edfe0100bb99f157262941421a16d48f6640a2f85d921e9a6f38d
    woodstar:
      image: ghcr.io/woodleighschool/woodstar/stemma:2.0.4@sha256:d1a3f920d9e810ef7b892d39108fa2ecfbf20c587affe27ff5a3b49d28f7d6c4
  components:
    mac-software:
      destinations:
        woodstar:
          retention:
            keep: 1
    windows-win32:
      destinations:
        intune:
          architectures:
            - x64
          minimum_windows_release: Windows11_24H2
          install_experience:
            run_as: system
            restart: based_on_return_code
          return_codes:
            - code: 0
              type: success
            - code: 1707
              type: success
            - code: 3010
              type: soft_reboot
            - code: 1641
              type: hard_reboot
            - code: 1618
              type: retry
  destinations:
    jamf:
      operation: jamf
      config:
        url: https://wdm.jamfcloud.com
        client_id: "{{ env.JAMF_CLIENT_ID }}"
        client_secret: "{{ env.JAMF_CLIENT_SECRET }}"
    intune:
      operation: intune
      config:
        client_id: "{{ env.INTUNE_CLIENT_ID }}"
        client_secret: "{{ env.INTUNE_CLIENT_SECRET }}"
        tenant_id: "{{ env.INTUNE_TENANT_ID }}"
    woodstar:
      operation: woodstar
      config:
        api_key: "{{ env.WOODSTAR_API_KEY }}"
        url: https://woodstar.woodleigh.vic.edu.au
  reconcile:
    source_control:
      type: github
      config:
        client_id: "{{ env.GITHUB_APP_CLIENT_ID }}"
        installation_id: "{{ env.GITHUB_APP_INSTALLATION_ID }}"
        private_key: "{{ env.GITHUB_APP_PRIVATE_KEY }}"
