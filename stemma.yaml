---
# yaml-language-server: $schema=https://raw.githubusercontent.com/woodleighschool/stemma-catalog/main/stemma.schema.json
apiVersion: stemma/v1alpha1
kind: Project
metadata:
  name: woodleigh-catalog
spec:
  imports:
    - software/**/*.yaml
  plugins:
    downloads:
      image: ghcr.io/woodleighschool/stemma-catalog/downloads:0.3.16@sha256:03e682fe12da8d3aa8229b1546f1ba92ae1703fa1bd48aff862343855e42e88e
    woodstar:
      image: ghcr.io/woodleighschool/woodstar/stemma:2.0.2@sha256:6ad81b1bae9816929c2b57291654b4eb2690f82b91aae7b3d6d3e6bd5b83f443
  components:
    mac-software:
      destinations:
        woodstar:
          retention:
            keep: 1
    windows-win32:
      destinations:
        intune:
          architectures:
            - x64
          minimum_windows_release: Windows11_24H2
          install_experience:
            run_as: system
            restart: based_on_return_code
          return_codes:
            - code: 0
              type: success
            - code: 1707
              type: success
            - code: 3010
              type: soft_reboot
            - code: 1641
              type: hard_reboot
            - code: 1618
              type: retry
  destinations:
    jamf:
      operation: jamf
      config:
        url: https://wdm.jamfcloud.com
        client_id: "{{ env.JAMF_CLIENT_ID }}"
        client_secret: "{{ env.JAMF_CLIENT_SECRET }}"
    intune:
      operation: intune
      config:
        client_id: "{{ env.INTUNE_CLIENT_ID }}"
        client_secret: "{{ env.INTUNE_CLIENT_SECRET }}"
        tenant_id: "{{ env.INTUNE_TENANT_ID }}"
    woodstar:
      operation: woodstar
      config:
        api_key: "{{ env.WOODSTAR_API_KEY }}"
        url: https://woodstar.woodleigh.vic.edu.au
  reconcile:
    source_control:
      type: github
      config:
        client_id: "{{ env.GITHUB_APP_CLIENT_ID }}"
        installation_id: "{{ env.GITHUB_APP_INSTALLATION_ID }}"
        private_key: "{{ env.GITHUB_APP_PRIVATE_KEY }}"
