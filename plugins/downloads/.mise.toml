[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
oras = "1.3.4"
goreleaser = "2.18.0"

[tasks.release-check]
description = "Validate the plugin release configuration"
run = "goreleaser check"

[tasks.snapshot]
description = "Build all plugin platform bundles without publishing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.publish-index]
description = "Publish the plugin release index after its platform bundles"
usage = 'arg "<tag>" help="Release tag already published by GoReleaser"'
run = '''
set -eu
tag="${usage_tag:?}"
set --
for os in darwin linux windows; do
  for arch in amd64 arm64; do
    set -- "$@" "${tag}-${os}-${arch}"
  done
done
oras manifest index create "ghcr.io/woodleighschool/stemma-catalog/downloads:${tag}" "$@"
'''

[tasks.deps]
description = "Download plugin dependencies"
run = "go mod download"

[tasks.build]
description = "Build the download resolvers"
run = "go build -trimpath -o build/plugin ./cmd/plugin"

[tasks.test]
description = "Run plugin checks"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.tidy]
description = "Tidy the plugin module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the plugin module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan plugin dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.lint]
description = "Run plugin linters"
run = "golangci-lint run"

[tasks.format]
description = "Format plugin code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Check plugin formatting"
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
