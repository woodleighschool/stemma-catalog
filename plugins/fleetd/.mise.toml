[tools]
go = "1.27.3"
"go:github.com/google/go-licenses/v2" = "v2.0.1"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"

[tasks.deps]
run = "go mod download"

[tasks.build]
run = "go build -trimpath -o build/plugin ./cmd/plugin"

[tasks.test]
description = "Vet Go code and run race-enabled tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.format]
run = "go fmt ./..."

[tasks.fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''
