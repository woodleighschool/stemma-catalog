---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  checks:
    name: Repository Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: --locked jactionlint oxfmt github:github/gh-aw

      - name: Check formatting
        run: mise run fmt-check

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

      - name: Compile agentic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run aw

      - name: Check compiled workflows
        run: git diff --exit-code -- .github/workflows .github/aw

  catalog:
    name: Catalog
    uses: $/.github/workflows/catalog.yaml

  plugins:
    name: Plugins
    uses: $/.github/workflows/plugins.yaml

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - checks
      - catalog
      - plugins
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
