---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Plugins

on:
  push:
    branches:
      - main
    paths:
      - plugins/**
      - .mise/**
      - LICENSE
      - .github/workflows/plugins.yaml
      - .github/workflows/release.yaml
  pull_request:
    paths:
      - plugins/**
      - .mise/**
      - LICENSE
      - .github/workflows/plugins.yaml
      - .github/workflows/release.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: ${{ matrix.plugin }}
    strategy:
      matrix:
        plugin: [downloads, fleetd]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          experimental: true
          working_directory: plugins/${{ matrix.plugin }}
          install_args: --locked go golangci-lint go:golang.org/x/vuln/cmd/govulncheck goreleaser

      - name: Check formatting
        run: mise run //plugins/${{ matrix.plugin }}:fmt-check

      - name: Check module tidiness
        run: mise run //plugins/${{ matrix.plugin }}:tidy-check

      - name: Lint
        run: mise run //plugins/${{ matrix.plugin }}:lint

      - name: Test
        run: mise run //plugins/${{ matrix.plugin }}:test

      - name: Build
        run: mise run //plugins/${{ matrix.plugin }}:build

      - name: Validate packaging
        run: mise run //plugins/${{ matrix.plugin }}:release-check

      - name: Check vulnerabilities
        run: mise run //plugins/${{ matrix.plugin }}:vulncheck
