---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Plugins

on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: ${{ matrix.plugin }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [downloads, fleetd]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          experimental: true
          working_directory: plugins/${{ matrix.plugin }}
          install_args: --locked go golangci-lint go:golang.org/x/vuln/cmd/govulncheck

      - name: Resolve Go cache
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ hashFiles(format('plugins/{0}/go.sum', matrix.plugin)) }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Check formatting
        run: mise run fmt-check

      - name: Check module tidiness
        run: mise run tidy-check

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Check vulnerabilities
        run: mise run vulncheck
