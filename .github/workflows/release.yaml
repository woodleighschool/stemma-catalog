---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  goreleaser:
    name: ${{ matrix.plugin }}
    strategy:
      matrix:
        plugin: [downloads, fleetd]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          experimental: true
          working_directory: plugins/${{ matrix.plugin }}
          install_args: --locked go go:github.com/google/go-licenses/v2 github:woodleighschool/stemma

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --parallelism=2
          workdir: plugins/${{ matrix.plugin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish plugin
        working-directory: plugins/${{ matrix.plugin }}
        env:
          IMAGE: ghcr.io/woodleighschool/stemma-catalog/${{ matrix.plugin }}:${{ steps.release-version.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          stemma plugins publish "$IMAGE" --goreleaser dist
          --annotation "org.opencontainers.image.source=${SOURCE}"
