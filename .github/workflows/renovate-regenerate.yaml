---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Regenerate

on:
  pull_request:
    branches:
      - main
    paths:
      - .mise/**
      - .github/workflows/**
      - .github/aw/**

permissions: {}

concurrency:
  group: renovate-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Regenerate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Generate dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
          permission-actions: write

      - name: Regenerate compiled workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_url=$(gh workflow run renovate-regenerate.yaml --repo woodleighschool/.github --ref main \
            --field "pull-request=${PR_NUMBER}" --field "head-sha=${HEAD_SHA}")
          gh run watch --repo woodleighschool/.github "${run_url##*/}" --exit-status
