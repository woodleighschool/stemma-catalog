---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Catalog

on:
  pull_request:
    paths:
      - software/**
      - icons/**
      - stemma.yaml
      - stemma.lock.yaml
      - .mise/**
      - .github/workflows/catalog.yaml
      - .github/actions/stemma-dev/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Stemma dev until it's released; then install the mise pin again.
      - name: Setup Stemma
        uses: $/.github/actions/stemma-dev

      # Stemma pulls plugin images with Docker credentials.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs before validation, which loads plugins: it refuses changed plugins
      # before any plugin code runs. Preparation needs no destination credentials.
      - name: Prepare changes
        run: stemma prepare --changed-since "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: Validate
        run: stemma validate
