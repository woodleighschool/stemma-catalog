---
rules:
  template-injection:
    ignore:
      # gh aw compile writes its guard settings from its own step outputs.
      - software-request.lock.yml
  self-repository:
    ignore:
      # gh aw compile takes local actions only as ./ paths.
      - software-request.lock.yml
  obfuscation:
    ignore:
      # The empty bot name is an expression on purpose; see the workflow source.
      - software-request.lock.yml
