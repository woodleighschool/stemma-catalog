---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Stemma
description: Build the reviewed Stemma revision

runs:
  using: composite
  steps:
    - name: Checkout Stemma
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: woodleighschool/stemma
        ref: f029a477be924802ff5688963d2d9f4f5575a4d0
        path: .stemma-build
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .stemma-build/go.mod
        cache-dependency-path: .stemma-build/go.sum

    - name: Build Stemma
      shell: bash
      env:
        CGO_ENABLED: "0"
      run: |
        commit=$(git -C .stemma-build rev-parse --short HEAD)
        go build -C .stemma-build -trimpath -ldflags "-s -w -X main.version=dev -X main.commit=$commit" \
          -o "$RUNNER_TEMP/stemma" ./cmd/stemma
        sudo install -m 0755 "$RUNNER_TEMP/stemma" /usr/local/bin/stemma
        rm -rf .stemma-build "$RUNNER_TEMP/stemma"
