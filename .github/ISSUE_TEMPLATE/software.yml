---
name: Software request
description: Request software to be added to the catalog.
labels: [software-request]
body:
  - type: markdown
    attributes:
      value: |
        Use the software or product name as the issue title.
        Available offers self-service installation; Required installs automatically. Leave both empty to add the software unassigned.

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Mac
        - Windows
    validations:
      required: true

  - type: dropdown
    id: available
    attributes:
      label: Available to
      description: Offered in Managed Software Center or Company Portal.
      multiple: true
      options:
        - "Mac: All Hosts"
        - "Mac: All Staff"
        - "Mac: All Students"
        - "Mac: CRT/Spare Shared MacBooks"
        - "Mac: NAPLAN Students"
        - "Mac: Minecraft Education Licence"
        - "Mac: Senior Campus"
        - "Mac: Minimbah Campus"
        - "Mac: Penbank Campus"
        - "Windows: All devices"
        - "Windows: All users"
        - "Windows: Lenovo devices"

  - type: dropdown
    id: required
    attributes:
      label: Required for
      description: Installed automatically.
      multiple: true
      options:
        - "Mac: All Hosts"
        - "Mac: All Staff"
        - "Mac: All Students"
        - "Mac: CRT/Spare Shared MacBooks"
        - "Mac: SAC MacBooks"
        - "Mac: NAPLAN Students"
        - "Mac: Minecraft Education Licence"
        - "Mac: Senior Campus"
        - "Mac: Minimbah Campus"
        - "Mac: Penbank Campus"
        - "Windows: All devices"
        - "Windows: All users"
        - "Windows: Lenovo devices"

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Optional constraints, such as an edition, release line, required feature, licensing requirement or useful vendor link.
      placeholder: |
        Music staff write scores in it. We need MuseScore Studio 4, not MuseScore 3.
        https://musescore.org/en/download
